name: Report a code
description: Tell us about a coupon code or deal link that did not behave as listed.
title: "[Code report]: "
labels: ["code-report"]
body:
  - type: input
    id: store
    attributes:
      label: Store
      description: The store the code or deal belongs to.
      placeholder: Example Store
    validations:
      required: true
  - type: input
    id: code
    attributes:
      label: Code
      description: The code exactly as it was shown to you. Leave empty if the problem is with a deal link.
      placeholder: CODE123
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What the assistant told you and what you saw at the store.
      placeholder: Describe what happened
    validations:
      required: true
